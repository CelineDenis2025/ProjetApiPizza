spring.application.name=Projet-API-Pizza

# Chemin du fichier de log
logging.file.name=logs/app.log

# Taille max avant rotation
logging.logback.rollingpolicy.max-file-size=10MB

# Nombre de fichiers archivés conservés
logging.logback.rollingpolicy.max-history=30

# Niveau de log (optionnel)
logging.level.root=INFO
logging.level.com.tonpackage=DEBUG


server.port=9999

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/mydb
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
